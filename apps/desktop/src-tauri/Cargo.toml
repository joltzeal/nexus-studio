[package]
name = "nexus-desktop"
version = "0.1.11"
description = "Nexus consumer desktop workspace"
authors = ["Nexus Studio"]
rust-version = "1.93"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
url = "2.5.8"
semver = "1.0.28"
sha2 = "0.10.9"
# Plugin store: the only HTTP client in the app. Blocking, because the
# catalog is fetched from a worker thread, never from the UI thread.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "socks"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
tauri-plugin-process = "2"
ring = "0.17.14"
tar = "0.4.46"
flate2 = "1.1.10"
tempfile = "3.27.0"
tauri-plugin-dialog = "2"
base64 = "0.22.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
