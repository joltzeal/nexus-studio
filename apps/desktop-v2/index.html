<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Before any stylesheet or script: the stored theme goes on <html>, so a
      // dark user's first frame is dark (PERF-08). Same key and values as the
      // kit's ThemeProvider, which takes over once React runs. Tauri adds this
      // script's hash to the page's CSP by itself (backend B6).
      (function () {
        try {
          var stored = localStorage.getItem("shardx-ui-kit-theme");
          var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.setAttribute("data-theme", dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/raccoon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raccoon · Profile workspace</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
