name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  plugins:
    if: github.repository == 'joltzeal/nexus-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build companion plugins
        run: pnpm -r --filter '@nexus/plugin-ai-image...' --filter '@nexus/plugin-shared-supply...' build
      - name: Pack companion plugins
        run: |
          node scripts/pack-plugin.mjs plugins/ai-image --changelog "100 everyday scenes, independent vision models and reference image selection."
          node scripts/pack-plugin.mjs plugins/shared-supply --changelog "Proxy-aware image downloads, chunked transport and validated image data."
          node scripts/build-market.mjs
      - name: Verify packaged plugin startup
        shell: bash
        run: |
          for file in market/plugins/*/*.nexuspkg; do
            node scripts/verify-package.mjs "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-market-${{ github.ref_name }}
          path: |
            market/catalog.json
            market/plugins/**/*.nexuspkg
          if-no-files-found: error
          retention-days: 14

  package:
    if: github.repository == 'joltzeal/nexus-studio'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            tauriArgs: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.macos.conf.json
          - os: macos-15-intel
            target: x86_64-apple-darwin
            tauriArgs: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.macos.conf.json
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            tauriArgs: --config src-tauri/tauri.release.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm runtime:stage
      - name: Verify staged runtime
        shell: bash
        run: |
          test -f apps/desktop/src-tauri/runtime/browser-runtime/dist/profile-runner.js
          test -f apps/desktop/src-tauri/runtime/browser-runtime/dist/network-preload.js
          test -f "apps/desktop/src-tauri/binaries/node-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: 'Nexus v__VERSION__'
          releaseBody: 'Desktop packages and signed update artifacts. Installation requires platform signing before public distribution.'
          releaseDraft: true
          uploadUpdaterJson: true
          args: ${{ matrix.tauriArgs }}
      - name: Verify signed macOS runtime
        if: runner.os == 'macOS'
        run: pnpm run runtime:verify-packaged apps/desktop/src-tauri/target/release/bundle/macos/Nexus.app

  publish:
    if: github.repository == 'joltzeal/nexus-studio'
    needs: [package, plugins]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
