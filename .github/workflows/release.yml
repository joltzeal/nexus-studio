name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    if: github.repository == 'joltzeal/nexus-studio'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            tauriArgs: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.macos.conf.json
          - os: macos-15-intel
            target: x86_64-apple-darwin
            tauriArgs: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.macos.conf.json
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            tauriArgs: --config src-tauri/tauri.release.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check public source boundary
        run: node scripts/check-public-boundary.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm runtime:stage
      - name: Run native regression tests
        run: pnpm rust:test
      - name: Check native formatting and lint
        run: pnpm rust:lint
      - name: Verify staged runtime
        shell: bash
        run: |
          test -f apps/desktop/src-tauri/runtime/browser-runtime/dist/profile-runner.js
          test -f apps/desktop/src-tauri/runtime/browser-runtime/dist/network-preload.js
          test -f "apps/desktop/src-tauri/binaries/node-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: 'Raccoon v__VERSION__'
          releaseBody: |
            - 修复上一版构建失败，调整原生账号观察类型与源码格式。
            - 窗口编辑定位已选代理，提供未占用代理与手机号筛选，并显示代理出口及检测状态。
            - 未配置代理的直连窗口在打开前再次确认。
            - Vinted 上架使用固定流程工具，执行前准备商品内容，窗口只负责表单操作与发布核对。
            - 账号检查区分封禁和掉登，并回填主页、余额及收款资料。
            - AI 生图增加做旧程度，采用生活化手机拍摄场景与自然英文卖家文案。
            - 邮箱阅读器增加 Microsoft Graph 写权限授权入口，失败时保留已读状态和原凭据。
            - 账号联系方式与窗口关联操作增加确认；插件页面返回保留列表筛选、页码和滚动位置。
            - 插件在本地开发并独立发布至插件商店，桌面应用构建不包含插件源码。

            请在插件中心检查并更新配套插件。
            macOS 安装包未公证，Windows 安装包未配置系统代码签名；更新包继续使用固定签名公钥校验。
          releaseDraft: true
          uploadUpdaterJson: true
          args: ${{ matrix.tauriArgs }}
      - name: Verify signed macOS runtime
        if: runner.os == 'macOS'
        run: pnpm run runtime:verify-packaged apps/desktop/src-tauri/target/release/bundle/macos/Raccoon.app

  publish:
    if: github.repository == 'joltzeal/nexus-studio'
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
