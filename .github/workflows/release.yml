name: Desktop release (0.2)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    if: github.repository == 'joltzeal/nexus-studio'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check public source boundary
        run: node scripts/check-public-boundary.mjs
      - name: Verify release tag
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.v2.conf.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:v2
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      - run: pnpm runtime:stage
      - name: Restore desktop build dependencies after production runtime deploy
        run: pnpm install --frozen-lockfile --prod=false
      - name: Verify desktop build CLI
        run: pnpm --dir apps/desktop exec tauri --version
      - name: Verify staged runtime
        shell: bash
        run: |
          test -f apps/desktop/src-tauri/runtime/browser-runtime/dist/profile-runner.js
          test -f apps/desktop/src-tauri/runtime/browser-runtime/dist/network-preload.js
          test -f "apps/desktop/src-tauri/binaries/node-${{ matrix.target }}"
      - name: Run native regression tests
        run: pnpm rust:test
      - name: Check native formatting and lint
        run: pnpm rust:lint
      - uses: tauri-apps/tauri-action@v0
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          tagName: v__VERSION__
          releaseName: 'Raccoon v__VERSION__'
          releaseBody: |
            - 代理池沿用主程序代理页面布局。可在详情中检测出口，也可批量检测选中或当前页启用的代理。
            - 邮箱支持每页数量选择和按邮箱标记全部已读，阅读器显示安全的内联格式。
            - Vinted 账号池批量创建按接入范围生成指纹种子，并显示确认失败或待核对结果。
            - 插件操作常驻显示，实验室按接入分标签，侧边栏显示更新进度和下载速度。
            - 插件包独立发布至 R2，应用安装包不内置插件。

            当前工作流只构建 macOS，安装包未公证；更新包继续使用固定签名公钥校验。
            0.2 使用独立数据目录，0.1 数据迁移尚待后续工具。共存安装时请将两个 Raccoon.app 放在不同目录。
          releaseDraft: true
          includeUpdaterJson: true
          args: >-
            --config src-tauri/tauri.v2.conf.json
            --config src-tauri/tauri.release.v2.conf.json
            --config src-tauri/tauri.release.macos.conf.json
      - name: Verify signed macOS runtime
        if: runner.os == 'macOS'
        run: pnpm run runtime:verify-packaged apps/desktop/src-tauri/target/release/bundle/macos/Raccoon.app

  publish:
    if: github.repository == 'joltzeal/nexus-studio'
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest
          mkdir -p "$RUNNER_TEMP/v2-update-channel"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/v2-update-channel"
          if ! gh release view raccoon-v2 >/dev/null 2>&1; then
            gh release create raccoon-v2 \
              --title 'Raccoon v2 updater channel' \
              --notes 'Updater manifest for installed Raccoon 0.2 versions.' \
              --prerelease \
              --latest=false
          fi
          gh release upload raccoon-v2 "$RUNNER_TEMP/v2-update-channel/latest.json" --clobber
