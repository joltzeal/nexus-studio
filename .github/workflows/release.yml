name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    if: github.repository == 'joltzeal/nexus-studio'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            tauriArgs: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.macos.conf.json
          - os: macos-15-intel
            target: x86_64-apple-darwin
            tauriArgs: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.macos.conf.json
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            tauriArgs: --config src-tauri/tauri.release.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check public source boundary
        run: node scripts/check-public-boundary.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm runtime:stage
      - name: Run native regression tests
        run: pnpm rust:test
      - name: Check native formatting and lint
        run: pnpm rust:lint
      - name: Restore desktop build dependencies after production runtime deploy
        run: pnpm install --frozen-lockfile --prod=false
      - name: Verify desktop build CLI
        run: pnpm --dir apps/desktop exec tauri --version
      - name: Verify staged runtime
        shell: bash
        run: |
          test -f apps/desktop/src-tauri/runtime/browser-runtime/dist/profile-runner.js
          test -f apps/desktop/src-tauri/runtime/browser-runtime/dist/network-preload.js
          test -f "apps/desktop/src-tauri/binaries/node-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          tagName: v__VERSION__
          releaseName: 'Raccoon v__VERSION__'
          releaseBody: |
            - 实验室可启用 AliasMode 接入，窗口管理支持创建、启动、停止及删除 AliasMode 浏览器环境。当前仅支持默认指纹和直连，需在本机运行 AliasMode。
            - 商品库简化动态表单属性，Ecom Agent 上架预检允许选填分类、成色、品牌和尺码；修复已归档商品的账号范围预检。
            - 插件包独立发布至 R2，应用安装包不内置插件；在插件中心检查更新。

            macOS 安装包未公证，Windows 安装包未配置系统代码签名；更新包继续使用固定签名公钥校验。
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.tauriArgs }}
      - name: Verify signed macOS runtime
        if: runner.os == 'macOS'
        run: pnpm run runtime:verify-packaged apps/desktop/src-tauri/target/release/bundle/macos/Raccoon.app

  publish:
    if: github.repository == 'joltzeal/nexus-studio'
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
