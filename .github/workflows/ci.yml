name: Foundation quality

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public source boundary
        run: node scripts/check-public-boundary.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build:packages
      - run: pnpm -r typecheck && pnpm exec tsc -p tsconfig.tests.json
      - run: pnpm exec vitest run
      - run: pnpm --filter @raccoon/desktop-v2 run build
      - run: node packages/browser-runtime/dist/healthcheck.js

  native:
    env:
      RUST_BACKTRACE: 1
      RUST_TEST_NOCAPTURE: 1
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the project Rust toolchain
        run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:v2
      - name: Verify Windows packaged runtime
        if: runner.os == 'Windows'
        run: pnpm runtime:stage
      - name: Restore development dependencies after production runtime deploy
        if: runner.os == 'Windows'
        run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm rust:test
      - run: pnpm rust:lint
